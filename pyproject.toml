[project]
name = "claude-memory-system"
version = "1.0.0"
description = "SQL-first knowledge graph memory persistence for Claude Code"
requires-python = ">=3.10"
dependencies = [
    "Pygments>=2.19",
    "sqlite-vec>=0.1.7",
    "fastembed>=0.4.0",
    "mcp>=1.0.0,<2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0",
    "pytest-cov>=7.0",
    "ruff>=0.9",
]

[tool.setuptools]
py-modules = []

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "working_day: tests for working-day functions (get_global_working_days, get_project_working_days)",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = [
    "E402",  # Module imports after sys.path.insert() are intentional
    "E501",  # Line length handled by formatter; too noisy for embedded prompt strings
]
