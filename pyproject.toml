[project]
name = "claude-memory-system"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "sqlite-vec>=0.1.7",
    "Pygments>=2.19",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = [
    "E402",  # Module imports after sys.path.insert() are intentional
    "E501",  # Line length handled by formatter; too noisy for embedded prompt strings
]
